name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22: npm@latest (12+) requires ^22.22.2 || ^24.15.0 || >=26.
          # A current npm is needed so packument readme/readmeFilename populate
          # (10.8.x left them empty even with README.md in the tarball — see RELEASING.md).
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use current npm for publish metadata
        run: npm install -g npm@latest

      - name: Install, prepare, and build
        env:
          NUXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run dev:prepare
          npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify publish manifest includes README
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')

          if (!fs.existsSync('README.md')) {
            console.error('README.md missing at package root')
            process.exit(1)
          }
          const files = require('./package.json').files || []
          if (!files.includes('README.md')) {
            console.error('package.json "files" must list README.md so packument metadata stays reliable')
            process.exit(1)
          }

          // Load @npmcli/package-json from the same npm that will run `npm publish`
          // (resolved via the npm binary — `npm root -g` can be wrong under some setups).
          const npmBin = fs.realpathSync(
            execSync('command -v npm', { encoding: 'utf8' }).trim(),
          )
          const npmPkgRoot = path.resolve(path.dirname(npmBin), '..')
          const PackageJson = require(path.join(npmPkgRoot, 'node_modules/@npmcli/package-json'))

          PackageJson.prepare('.').then((pkg) => {
            const { readme, readmeFilename } = pkg.content
            const len = typeof readme === 'string' ? readme.length : 0
            console.log(`prepare(): readmeFilename=${readmeFilename} readmeBytes=${len}`)
            if (!readmeFilename || len < 32 || String(readme).startsWith('ERROR:')) {
              console.error('Publish manifest would ship without a usable README — aborting')
              process.exit(1)
            }
          }).catch((err) => {
            console.error(err)
            process.exit(1)
          })
          NODE

          # Confirm the packed tarball contains README.md (files list + always-include).
          npm pack --ignore-scripts >/dev/null
          REAL="$(ls -1 ./*.tgz | head -1)"
          tar -tzf "$REAL" | grep -E '^package/README\.md$'
          rm -f "$REAL"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Extract CHANGELOG notes for this version
        env:
          VER: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const ver = process.env.VER.replace(/^v/, '')
          const text = fs.readFileSync('CHANGELOG.md', 'utf8')
          const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const re = new RegExp(
            `^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|^\\[[^\\]]+\\]:|\\Z)`,
            'm',
          )
          const m = text.match(re)
          if (!m) {
            console.error(`No CHANGELOG section for ${ver}`)
            process.exit(1)
          }
          const body = `${m[1].trim()}\n`
          fs.writeFileSync('release-notes.md', body)
          console.log(`Wrote ${body.length} chars of notes for ${ver}`)
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
