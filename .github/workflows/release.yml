name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install, prepare, and build
        env:
          NUXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run dev:prepare
          npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Extract CHANGELOG notes for this version
        env:
          VER: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const ver = process.env.VER.replace(/^v/, '')
          const text = fs.readFileSync('CHANGELOG.md', 'utf8')
          const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const re = new RegExp(
            `^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|^\\[[^\\]]+\\]:|\\Z)`,
            'm',
          )
          const m = text.match(re)
          if (!m) {
            console.error(`No CHANGELOG section for ${ver}`)
            process.exit(1)
          }
          const body = `${m[1].trim()}\n`
          fs.writeFileSync('release-notes.md', body)
          console.log(`Wrote ${body.length} chars of notes for ${ver}`)
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
